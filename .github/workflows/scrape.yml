name: Midtown CB Minutes Scraper & AI Ingestion

on:
  schedule:
    - cron: '0 6 * * *'   # daily at 06:00 UTC (2am Eastern)
  workflow_dispatch:       # manual "Run workflow" button in the Actions tab

permissions:
  contents: write

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scraper
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scraper.py

      - name: Commit updated data
        run: |
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/minutes.json
          git diff --cached --quiet || git commit -m "auto: update community board minutes data [skip ci]"
          git push
